<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>🎵 آهنگ‌های من</title>
<style>
body{font-family:Tahoma;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:20px;margin:0}
h1{text-align:center;color:white}
.stats{text-align:center;color:white;margin-bottom:20px}
.song{background:white;border-radius:15px;padding:20px;margin:20px auto;max-width:700px}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
button,.btn{padding:9px 18px;border-radius:8px;border:none;cursor:pointer;color:white;font-family:Tahoma;text-decoration:none;font-weight:bold}
.like{background:#ef4444}
.download{background:#06d6a0}
.comment{background:#f59e0b}
.comment-box{display:none;margin-top:15px;padding-top:15px;border-top:1px solid #eee}
.comment-box.show{display:block}
.comment{background:#f5f5f5;padding:8px;border-radius:8px;margin-bottom:6px}
input{padding:8px;border:1px solid #ddd;border-radius:8px;font-family:Tahoma}
</style>
</head>
<body>
<h1>🎵 آهنگ‌های من</h1>
<div class="stats">❤️ <span id="likeCount">0</span> | 💬 <span id="commentCount">0</span></div>
<div id="songs"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, onValue, push, runTransaction } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

const app = initializeApp({databaseURL: "https://music-site-a2343-default-rtdb.firebaseio.com/"});
const db = getDatabase(app);

const songs = [
  { id: "song1", name: "علی منتظری - جانان", file: "janan.mp3" },
  { id: "song2", name: "علی ایزدی - محلی شیرازی", file: "mahali.mp3" }
];

let data = { likes: {}, comments: {} };

onValue(ref(db, "likes"), s => { data.likes = s.val() || {}; render(); });
onValue(ref(db, "comments"), s => { data.comments = s.val() || {}; render(); });

function render() {
  const c = document.getElementById("songs");
  let sorted = [...songs].sort((a,b) => (data.likes[b.id]||0) - (data.likes[a.id]||0));
  c.innerHTML = sorted.map(s => `
    <div class="song">
      <h3>${s.name}</h3>
      <audio controls src="${s.file}" style="width:100%"></audio>
      <div class="actions">
        <button class="like" onclick="window.like('${s.id}')">❤️ ${data.likes[s.id]||0}</button>
        <a href="${s.file}" download class="btn download">⬇️ دانلود</a>
        <button class="comment" onclick="window.toggle('${s.id}')">💬 کامنت</button>
      </div>
      <div class="comment-box" id="c-${s.id}">
        <div id="cl-${s.id}"></div>
        <div style="display:flex;gap:5px;margin-top:10px">
          <input id="n-${s.id}" placeholder="اسم">
          <input id="t-${s.id}" placeholder="کامنت">
          <button class="comment" onclick="window.addComment('${s.id}')">ارسال</button>
        </div>
      </div>
    </div>
  `).join("");
  songs.forEach(s => loadComments(s.id));
  updateStats();
}

window.like = id => runTransaction(ref(db, "likes/" + id), c => (c || 0) + 1);
window.toggle = id => document.getElementById("c-" + id).classList.toggle("show");
window.addComment = id => {
  const n = document.getElementById("n-" + id).value.trim();
  const t = document.getElementById("t-" + id).value.trim();
  if (!n || !t) return alert("پر کن!");
  push(ref(db, "comments/" + id), {name: n, text: t, time: Date.now()});
  document.getElementById("n-" + id).value = "";
  document.getElementById("t-" + id).value = "";
};

function loadComments(id) {
  const el = document.getElementById("cl-" + id);
  const list = Object.values(data.comments[id] || {}).sort((a,b) => a.time - b.time);
  el.innerHTML = list.length === 0
    ? '<p style="color:#999;font-size:0.85rem">هنوز کامنتی نیست</p>'
    : list.map(c => `<div class="comment"><b>${c.name}</b>: ${c.text}</div>`).join("");
}

function updateStats() {
  let l = 0, c = 0;
  Object.values(data.likes).forEach(v => l += v);
  Object.values(data.comments).forEach(o => c += Object.keys(o).length);
  document.getElementById("likeCount").textContent = l;
  document.getElementById("commentCount").textContent = c;
}
</script>
</body>
</html>
