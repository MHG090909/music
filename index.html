<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎵 آهنگ‌های من</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: Tahoma, sans-serif; background: linear-gradient(135deg, #667eea, #764ba2); min-height: 100vh; padding: 20px; transition: 0.3s; }
body.dark { background: linear-gradient(135deg, #1a1a2e, #16213e); }

header { text-align: center; margin-bottom: 30px; position: relative; }
h1 { color: white; font-size: 2.5rem; margin-bottom: 10px; text-shadow: 2px 2px 10px rgba(0,0,0,0.3); }
.subtitle { color: rgba(255,255,255,0.9); margin-bottom: 20px; }

.theme-btn {
  position: absolute; top: 0; left: 0;
  background: rgba(255,255,255,0.2); border: 2px solid white;
  color: white; padding: 8px 15px; border-radius: 20px;
  cursor: pointer; font-family: Tahoma; font-size: 0.9rem;
}
.theme-btn:hover { background: rgba(255,255,255,0.3); }

.stats { display: flex; justify-content: center; gap: 15px; margin-bottom: 25px; flex-wrap: wrap; }
.stat-box {
  background: rgba(255,255,255,0.2); color: white;
  padding: 10px 20px; border-radius: 50px; font-size: 0.9rem;
  backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.3);
}

.search-box { max-width: 500px; margin: 0 auto 20px; }
.search-box input {
  width: 100%; padding: 15px 25px; border: none; border-radius: 50px;
  font-size: 1rem; outline: none; font-family: Tahoma;
  box-shadow: 0 5px 20px rgba(0,0,0,0.2);
}

.categories { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
.cat-btn {
  background: rgba(255,255,255,0.2); color: white;
  border: 2px solid rgba(255,255,255,0.4); padding: 8px 20px;
  border-radius: 50px; cursor: pointer; font-family: Tahoma; font-size: 0.9rem;
}
.cat-btn:hover, .cat-btn.active { background: white; color: #667eea; }

.songs { max-width: 850px; margin: 0 auto; display: grid; gap: 20px; }
.song {
  background: white; border-radius: 15px; padding: 20px;
  display: flex; gap: 20px; align-items: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2); transition: transform 0.2s;
}
.song:hover { transform: translateY(-3px); }
body.dark .song { background: #2a2a3e; }
body.dark .info h3 { color: white; }

.cover {
  width: 90px; height: 90px; border-radius: 12px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  display: flex; align-items: center; justify-content: center;
  font-size: 2.5rem; flex-shrink: 0; position: relative; overflow: hidden;
}
.cover img { width: 100%; height: 100%; object-fit: cover; }
.rank {
  position: absolute; top: -8px; right: -8px;
  background: #f59e0b; color: white; width: 30px; height: 30px;
  border-radius: 50%; display: flex; align-items: center;
  justify-content: center; font-weight: bold; box-shadow: 0 3px 10px rgba(0,0,0,0.3);
}

.info { flex: 1; min-width: 0; }
.info h3 { color: #333; margin-bottom: 10px; }
audio { width: 100%; height: 40px; margin-bottom: 8px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; gap: 5px;
  background: #06d6a0; color: white; padding: 9px 18px;
  border-radius: 8px; text-decoration: none; font-weight: bold;
  font-size: 0.9rem; border: none; cursor: pointer;
  font-family: Tahoma; transition: 0.2s;
}
.btn:hover { transform: scale(1.05); }
.btn.like { background: #ef4444; }
.btn.comment { background: #f59e0b; }

.comments { margin-top: 15px; padding-top: 15px; border-top: 1px solid #eee; display: none; }
body.dark .comments { border-color: #444; }
.comments.show { display: block; }
.comment { background: #f5f5f5; padding: 10px; border-radius: 8px; margin-bottom: 8px; }
body.dark .comment { background: #1a1a2e; color: white; }
.comment .name { font-weight: bold; color: #667eea; margin-bottom: 5px; }
.comment-form { display: flex; gap: 5px; margin-top: 10px; flex-wrap: wrap; }
.comment-form input { flex: 1; min-width: 100px; padding: 8px; border: 1px solid #ddd; border-radius: 8px; font-family: Tahoma; }
body.dark .comment-form input { background: #1a1a2e; color: white; border-color: #444; }
.comment-form button { background: #667eea; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-family: Tahoma; }

.empty { text-align: center; color: white; font-size: 1.2rem; padding: 50px; }
.footer { text-align: center; color: rgba(255,255,255,0.8); margin-top: 40px; padding: 20px; font-size: 0.9rem; }

@media (max-width: 600px) {
  h1 { font-size: 1.8rem; }
  .song { flex-direction: column; text-align: center; }
  .cover { width: 130px; height: 130px; }
  .actions { justify-content: center; }
  .theme-btn { position: static; margin-bottom: 15px; }
}
</style>
</head>
<body>

<header>
  <button class="theme-btn" onclick="toggleTheme()">🌙 حالت شب</button>
  <h1>🎵 آهنگ‌های من</h1>
  <p class="subtitle">گوش بده و دانلود کن</p>
</header>

<div class="stats">
  <div class="stat-box">🎵 <span id="songCount">0</span> آهنگ</div>
  <div class="stat-box">❤️ <span id="likeCount">0</span> لایک</div>
  <div class="stat-box">💬 <span id="commentCount">0</span> کامنت</div>
</div>

<div class="search-box">
  <input type="text" id="search" placeholder="🔍 جستجوی آهنگ...">
</div>

<div class="categories" id="categories"></div>
<div class="songs" id="songs"></div>

<div class="footer">© 2026 - ساخته شده با ❤️</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, onValue, push, runTransaction } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

const app = initializeApp({databaseURL: "https://music-site-a2343-default-rtdb.firebaseio.com/"});
const db = getDatabase(app);

// ==========================================
// آهنگ‌ها - اینجا رو ادیت کن
// ==========================================
const songs = [
  { id: "song1", name: "علی منتظری - جانان", file: "janan.mp3", cover: "", cat: "سنتی" },
  { id: "song2", name: "علی ایزدی - محلی شیرازی", file: "mahali.mp3", cover: "", cat: "محلی" }
];

let data = { likes: {}, comments: {} };
let currentCat = "all";

// ==========================================
// Firebase
// ==========================================
onValue(ref(db, "likes"), s => { data.likes = s.val() || {}; render(); });
onValue(ref(db, "comments"), s => { data.comments = s.val() || {}; render(); });

// ==========================================
// دسته‌بندی
// ==========================================
const categories = ["all", ...new Set(songs.map(s => s.cat))];
document.getElementById("categories").innerHTML = categories.map(c =>
  `<button class="cat-btn ${c==='all'?'active':''}" data-cat="${c}">${c==='all'?'همه':c}</button>`
).join("");

document.getElementById("categories").addEventListener("click", e => {
  if (e.target.classList.contains("cat-btn")) {
    document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
    e.target.classList.add("active");
    currentCat = e.target.dataset.cat;
    render();
  }
});

// ==========================================
// جستجو
// ==========================================
document.getElementById("search").addEventListener("input", render);

// ==========================================
// نمایش آهنگ‌ها
// ==========================================
function render() {
  const container = document.getElementById("songs");
  const q = document.getElementById("search").value.toLowerCase();
  
  let filtered = songs;
  if (currentCat !== "all") filtered = filtered.filter(s => s.cat === currentCat);
  if (q) filtered = filtered.filter(s => s.name.toLowerCase().includes(q));
  
  let sorted = [...filtered].sort((a,b) => (data.likes[b.id]||0) - (data.likes[a.id]||0));
  
  if (sorted.length === 0) {
    container.innerHTML = '<p class="empty">آهنگی پیدا نشد 🎧</p>';
    return;
  }
  
  container.innerHTML = sorted.map((s, i) => {
    const likes = data.likes[s.id] || 0;
    return `
    <div class="song">
      <div class="cover">
        ${s.cover ? `<img src="${s.cover}" alt="">` : '🎵'}
        ${i < 3 ? `<div class="rank">${i+1}</div>` : ''}
      </div>
      <div class="info">
        <h3>${s.name}</h3>
        <audio controls src="${s.file}"></audio>
        <div class="actions">
          <button class="btn like" onclick="window.like('${s.id}')">❤️ ${likes}</button>
          <a href="${s.file}" download class="btn">⬇️ دانلود</a>
          <button class="btn comment" onclick="window.toggle('${s.id}')">💬 کامنت</button>
        </div>
        <div class="comments" id="c-${s.id}">
          <div id="cl-${s.id}"></div>
          <div class="comment-form">
            <input id="n-${s.id}" placeholder="اسم">
            <input id="t-${s.id}" placeholder="کامنت">
            <button onclick="window.addComment('${s.id}')">ارسال</button>
          </div>
        </div>
      </div>
    </div>`;
  }).join("");
  
  songs.forEach(s => loadComments(s.id));
  updateStats();
}

// ==========================================
// ❤️ لایک
// ==========================================
window.like = id => runTransaction(ref(db, "likes/" + id), c => (c || 0) + 1);

// ==========================================
// 💬 کامنت
// ==========================================
window.toggle = id => document.getElementById("c-" + id).classList.toggle("show");

window.addComment = id => {
  const name = document.getElementById("n-" + id).value.trim();
  const text = document.getElementById("t-" + id).value.trim();
  if (!name || !text) return alert("اسم و کامنت رو پر کن!");
  push(ref(db, "comments/" + id), { name, text, time: Date.now() });
  document.getElementById("n-" + id).value = "";
  document.getElementById("t-" + id).value = "";
};

function loadComments(id) {
  const el = document.getElementById("cl-" + id);
  if (!el) return;
  const list = Object.values(data.comments[id] || {}).sort((a,b) => a.time - b.time);
  el.innerHTML = list.length === 0
    ? '<p style="color:#999;font-size:0.85rem">هنوز کامنتی نیست</p>'
    : list.map(c => `<div class="comment"><div class="name">${c.name}</div><div>${c.text}</div></div>`).join("");
}

// ==========================================
// 📊 آمار
// ==========================================
function updateStats() {
  let l = 0, c = 0;
  Object.values(data.likes).forEach(v => l += v);
  Object.values(data.comments).forEach(o => c += Object.keys(o).length);
  document.getElementById("likeCount").textContent = l;
  document.getElementById("commentCount").textContent = c;
  document.getElementById("songCount").textContent = songs.length;
}

// ==========================================
// 🌙 حالت شب
// ==========================================
window.toggleTheme = function() {
  document.body.classList.toggle("dark");
  const isDark = document.body.classList.contains("dark");
  document.querySelector(".theme-btn").textContent = isDark ? "☀️ حالت روز" : "🌙 حالت شب";
  localStorage.setItem("theme", isDark ? "dark" : "light");
};

if (localStorage.getItem("theme") === "dark") {
  document.body.classList.add("dark");
  document.querySelector(".theme-btn").textContent = "☀️ حالت روز";
}
</script>

</body>
</html>
