<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎵 آهنگ‌های من</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Tahoma,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:20px;color:#fff}
h1{text-align:center;font-size:2.5rem;margin-bottom:10px}
.stats{display:flex;justify-content:center;gap:15px;margin-bottom:25px;flex-wrap:wrap}
.stat-box{background:rgba(255,255,255,0.2);padding:10px 20px;border-radius:50px;font-size:0.9rem}
.badge{text-align:center;margin-bottom:15px;padding:8px 15px;border-radius:50px;display:inline-block;font-size:0.85rem}
.search{max-width:500px;margin:0 auto 20px}
.search input{width:100%;padding:15px 25px;border:none;border-radius:50px;font-family:Tahoma;font-size:1rem;outline:none}
.cats{display:flex;justify-content:center;gap:10px;margin-bottom:30px;flex-wrap:wrap}
.cats button{background:rgba(255,255,255,0.2);color:#fff;border:2px solid rgba(255,255,255,0.4);padding:8px 20px;border-radius:50px;cursor:pointer;font-family:Tahoma}
.cats button.active{background:#fff;color:#667eea}
.songs{max-width:850px;margin:0 auto;display:grid;gap:20px}
.song{background:#fff;color:#333;border-radius:15px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,0.2);display:flex;gap:20px;align-items:center}
.cover{width:90px;height:90px;border-radius:12px;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;font-size:2.5rem;flex-shrink:0}
.info{flex:1}
.info h3{margin-bottom:10px}
audio{width:100%;margin-bottom:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions button,.actions a{padding:9px 18px;border:none;border-radius:8px;cursor:pointer;font-family:Tahoma;font-weight:bold;color:#fff;text-decoration:none;font-size:0.9rem}
.like{background:#ef4444}
.dl{background:#06d6a0}
.cmt{background:#f59e0b}
.comments{display:none;margin-top:15px;padding-top:15px;border-top:1px solid #eee}
.comments.show{display:block}
.comment{background:#f5f5f5;padding:10px;border-radius:8px;margin-bottom:8px}
.comment b{color:#667eea}
.cform{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap}
.cform input{flex:1;min-width:100px;padding:8px;border:1px solid #ddd;border-radius:8px;font-family:Tahoma}
.cform button{background:#667eea;color:#fff;border:none;padding:8px 15px;border-radius:8px;cursor:pointer}
@media(max-width:600px){.song{flex-direction:column;text-align:center}}
</style>
</head>
<body>
<h1>🎵 آهنگ‌های من</h1>
<div style="text-align:center"><span class="badge" id="badge">⏳ در حال بررسی...</span></div>
<div class="stats">
  <div class="stat-box">🎵 <span id="sc">0</span></div>
  <div class="stat-box">❤️ <span id="lc">0</span></div>
  <div class="stat-box">💬 <span id="cc">0</span></div>
</div>
<div class="search"><input id="s" placeholder="🔍 جستجو..."></div>
<div class="cats" id="cats"></div>
<div class="songs" id="songs"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const URL = "https://uigclyyoamfqbwekwnvw.supabase.co";
const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVpZ2NseXlvYW1mcWJld2t3bnZ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2MjI5NjAsImV4cCI6MjEwNTE5ODk2MH0.0yc48guH4ZOXw3UBjgv8QuX3eObZ525M5s9__zx770U";

const sb = createClient(URL, KEY);

const songs = [
  { id: "song1", name: "علی منتظری - جانان", file: "janan.mp3", cat: "پاپ" },
  { id: "song2", name: "علی ایزدی - محلی شیرازی", file: "mahali.mp3", cat: "محلی" }
];

let data = { likes: {}, comments: {} };
let cat = "all";
let online = false;

async function load() {
  // امتحان اتصال
  try {
    const { data: L, error } = await sb.from('likes').select('*');
    if (!error) {
      online = true;
      document.getElementById("badge").textContent = "🌐 حالت مشترک (لایک/کامنت برای همه)";
      document.getElementById("badge").style.background = "rgba(6,214,160,0.5)";
      
      data.likes = {};
      if (L) L.forEach(x => data.likes[x.song_id] = x.count);
      
      const { data: C } = await sb.from('comments').select('*').order('created_at');
      data.comments = {};
      if (C) C.forEach(x => {
        if (!data.comments[x.song_id]) data.comments[x.song_id] = [];
        data.comments[x.song_id].push(x);
      });
    }
  } catch(e) {
    console.log("خطا:", e);
  }
  
  if (!online) {
    document.getElementById("badge").textContent = "📱 حالت محلی (فقط خودت)";
    document.getElementById("badge").style.background = "rgba(245,158,11,0.5)";
    const saved = localStorage.getItem("musicData");
    if (saved) {
      const d = JSON.parse(saved);
      data.likes = d.likes || {};
      data.comments = d.comments || {};
    }
  }
  
  render();
}

window.like = async function(id) {
  const n = (data.likes[id] || 0) + 1;
  data.likes[id] = n;
  render();
  
  if (online) {
    try {
      const { data: ex } = await sb.from('likes').select('*').eq('song_id', id).single();
      if (ex) await sb.from('likes').update({ count: n }).eq('song_id', id);
      else await sb.from('likes').insert({ song_id: id, count: n });
    } catch(e) { console.log(e); }
  } else {
    localStorage.setItem("musicData", JSON.stringify(data));
  }
};

window.toggle = id => document.getElementById("c-" + id).classList.toggle("show");

window.addC = async function(id) {
  const n = document.getElementById("n-" + id).value.trim();
  const t = document.getElementById("t-" + id).value.trim();
  if (!n || !t) return alert("پر کن!");
  if (!data.comments[id]) data.comments[id] = [];
  data.comments[id].push({ name: n, text: t });
  render();
  document.getElementById("n-" + id).value = "";
  document.getElementById("t-" + id).value = "";
  document.getElementById("c-" + id).classList.add("show");
  
  if (online) {
    try { await sb.from('comments').insert({ song_id: id, name: n, text: t }); }
    catch(e) { console.log(e); }
  } else {
    localStorage.setItem("musicData", JSON.stringify(data));
  }
};

const cats = ["all", ...new Set(songs.map(s => s.cat))];
document.getElementById("cats").innerHTML = cats.map(c =>
  `<button class="${c==='all'?'active':''}" data-c="${c}">${c==='all'?'همه':c}</button>`
).join("");

document.getElementById("cats").onclick = e => {
  if (e.target.tagName === 'BUTTON') {
    document.querySelectorAll(".cats button").forEach(b => b.classList.remove("active"));
    e.target.classList.add("active");
    cat = e.target.dataset.c;
    render();
  }
};

document.getElementById("s").oninput = render;

function render() {
  const q = document.getElementById("s").value.toLowerCase();
  let list = songs;
  if (cat !== "all") list = list.filter(s => s.cat === cat);
  if (q) list = list.filter(s => s.name.toLowerCase().includes(q));

  document.getElementById("songs").innerHTML = list.map(s => {
    const l = data.likes[s.id] || 0;
    const cs = data.comments[s.id] || [];
    return `<div class="song">
      <div class="cover">🎵</div>
      <div class="info">
        <h3>${s.name}</h3>
        <audio controls src="${s.file}"></audio>
        <div class="actions">
          <button class="like" onclick="window.like('${s.id}')">❤️ ${l}</button>
          <a href="${s.file}" download class="dl">⬇️ دانلود</a>
          <button class="cmt" onclick="window.toggle('${s.id}')">💬 کامنت</button>
        </div>
        <div class="comments" id="c-${s.id}">
          ${cs.length === 0 ? '<p style="color:#999;font-size:0.85rem">هنوز کامنتی نیست</p>' :
            cs.map(c => `<div class="comment"><b>${c.name}</b>: ${c.text}</div>`).join("")}
          <div class="cform">
            <input id="n-${s.id}" placeholder="اسم">
            <input id="t-${s.id}" placeholder="کامنت">
            <button onclick="window.addC('${s.id}')">ارسال</button>
          </div>
        </div>
      </div>
    </div>`;
  }).join("");

  let tl = 0, tc = 0;
  Object.values(data.likes).forEach(v => tl += v);
  Object.values(data.comments).forEach(a => tc += (a || []).length);
  document.getElementById("lc").textContent = tl;
  document.getElementById("cc").textContent = tc;
  document.getElementById("sc").textContent = songs.length;
}

load();
</script>
</body>
</html>
