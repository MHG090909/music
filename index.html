<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎵 آهنگ‌های من</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Tahoma,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:20px;color:#fff}
h1{text-align:center;font-size:2.5rem;margin-bottom:10px}
.stats{display:flex;justify-content:center;gap:15px;margin-bottom:25px;flex-wrap:wrap}
.stat-box{background:rgba(255,255,255,0.2);padding:10px 20px;border-radius:50px;font-size:0.9rem}
.badge{text-align:center;margin-bottom:15px;padding:8px 15px;border-radius:50px;display:inline-block;font-size:0.85rem}
.top-bar{display:flex;justify-content:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.top-bar button{background:rgba(255,255,255,0.2);color:#fff;border:2px solid rgba(255,255,255,0.4);padding:10px 18px;border-radius:50px;cursor:pointer;font-family:Tahoma;font-size:0.85rem;font-weight:700}
.top-bar button.admin-active{background:#f59e0b;border-color:#f59e0b}
.search{max-width:500px;margin:0 auto 20px}
.search input{width:100%;padding:15px 25px;border:none;border-radius:50px;font-family:Tahoma;font-size:1rem;outline:none}
.cats{display:flex;justify-content:center;gap:10px;margin-bottom:30px;flex-wrap:wrap}
.cats button{background:rgba(255,255,255,0.2);color:#fff;border:2px solid rgba(255,255,255,0.4);padding:8px 20px;border-radius:50px;cursor:pointer;font-family:Tahoma;font-weight:700}
.cats button.active{background:#fff;color:#667eea}
.songs{max-width:850px;margin:0 auto;display:grid;gap:20px}
.song{background:#fff;color:#333;border-radius:20px;padding:20px;box-shadow:0 15px 40px rgba(0,0,0,0.25);display:flex;gap:20px;align-items:center}
.cover{width:90px;height:90px;border-radius:15px;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;font-size:2.5rem;flex-shrink:0}
.info{flex:1}
.info h3{margin-bottom:10px}
audio{width:100%;margin-bottom:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.actions button,.actions a{padding:10px 18px;border:none;border-radius:10px;cursor:pointer;font-family:Tahoma;font-weight:700;color:#fff;text-decoration:none;font-size:0.9rem}
.like{background:#ef4444}
.like.liked{background:#6b7280}
.dl{background:#06d6a0}
.cmt{background:#f59e0b}
.share{background:#8b5cf6}
.comments{display:none;margin-top:15px;padding-top:15px;border-top:1px solid #eee}
.comments.show{display:block}
.comment{background:#f5f5f5;padding:12px;border-radius:10px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px}
.comment b{color:#667eea}
.comment .time{font-size:0.75rem;color:#999;margin-right:10px}
.comment .delete-btn{background:#ef4444;color:#fff;border:none;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:0.8rem;display:none}
.comment .delete-btn.show{display:block}
.cform{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap}
.cform input{flex:1;min-width:100px;padding:10px;border:2px solid #ddd;border-radius:10px;font-family:Tahoma}
.cform button{background:#667eea;color:#fff;border:none;padding:10px 20px;border-radius:10px;cursor:pointer;font-family:Tahoma;font-weight:700}
.warn{color:#f59e0b;font-size:0.8rem;margin-top:5px;font-weight:700}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#06d6a0;color:#fff;padding:15px 25px;border-radius:15px;font-weight:700;z-index:9999;display:none}
.toast.error{background:#ef4444}
.toast.show{display:block}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:none;align-items:center;justify-content:center;z-index:9999;padding:20px}
.modal.show{display:flex}
.modal-content{background:#fff;color:#333;border-radius:20px;padding:30px;max-width:400px;width:100%;text-align:center}
.modal-content h2{margin-bottom:20px;color:#667eea}
.modal-content input{width:100%;padding:15px;border:2px solid #ddd;border-radius:10px;font-family:Tahoma;font-size:1rem;margin-bottom:15px;text-align:center}
.modal-content button{background:#667eea;color:#fff;border:none;padding:12px 30px;border-radius:10px;cursor:pointer;font-family:Tahoma;font-weight:700;font-size:1rem;margin:5px}
.modal-content button.cancel{background:#6b7280}
@media(max-width:600px){h1{font-size:1.8rem}.song{flex-direction:column;text-align:center}}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="modal" id="adminModal">
  <div class="modal-content">
    <h2>🔐 ورود ادمین</h2>
    <input type="password" id="adminPass" placeholder="رمز..." onkeypress="if(event.key==='Enter')checkAdmin()">
    <div>
      <button onclick="checkAdmin()">ورود</button>
      <button class="cancel" onclick="closeAdmin()">انصراف</button>
    </div>
  </div>
</div>

<h1>🎵 آهنگ‌های من</h1>
<div style="text-align:center"><span class="badge" id="badge">⏳ در حال بررسی...</span></div>

<div class="top-bar">
  <button onclick="toggleTheme()" id="themeBtn">🌙 حالت شب</button>
  <button onclick="sortBy('like')">🔥 پرطرفدار</button>
  <button onclick="sortBy('new')">🆕 جدیدترین</button>
  <button onclick="sortBy('name')">🔤 الفبایی</button>
  <button onclick="openAdmin()" id="adminBtn">🔐 ورود ادمین</button>
</div>

<div class="stats">
  <div class="stat-box">🎵 <span id="sc">0</span> آهنگ</div>
  <div class="stat-box">❤️ <span id="lc">0</span> لایک</div>
  <div class="stat-box">💬 <span id="cc">0</span> کامنت</div>
</div>
<div class="search"><input id="s" placeholder="🔍 جستجو..."></div>
<div class="cats" id="cats"></div>
<div class="songs" id="songs"></div>

<script>
var API = "https://music-api.mhg090909.workers.dev";
var ADMIN_PASSWORD = "mhg2026";
var BAD_WORDS = ["فحش","احمق","خری","کثافت","بی‌شعور","دیوث","کس","کیر","جنده","لاشی","پدرسگ","لعنت","نفرین","حروم","خار","کونی","گایید","بگا","پفیوز","کص","کون","جقی","شاش","گوه"];

var songs = [];
var data = { likes: {}, comments: {} };
var cat = "all";
var online = false;
var sortType = "like";
var isAdmin = sessionStorage.getItem("isAdmin") === "1";

function toast(msg, isError) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show" + (isError ? " error" : "");
  setTimeout(function() { t.classList.remove("show"); }, 3000);
}

function openAdmin() {
  if (isAdmin) {
    isAdmin = false;
    sessionStorage.removeItem("isAdmin");
    document.getElementById("adminBtn").textContent = "🔐 ورود ادمین";
    document.getElementById("adminBtn").classList.remove("admin-active");
    toast("🔓 خارج شدی");
    render();
    return;
  }
  document.getElementById("adminModal").classList.add("show");
  setTimeout(function() { document.getElementById("adminPass").focus(); }, 100);
}

function closeAdmin() {
  document.getElementById("adminModal").classList.remove("show");
  document.getElementById("adminPass").value = "";
}

function checkAdmin() {
  var pass = document.getElementById("adminPass").value;
  if (pass === ADMIN_PASSWORD) {
    isAdmin = true;
    sessionStorage.setItem("isAdmin", "1");
    document.getElementById("adminBtn").textContent = "🔓 خروج از ادمین";
    document.getElementById("adminBtn").classList.add("admin-active");
    closeAdmin();
    toast("✅ خوش آمدی ادمین!");
    render();
  } else {
    toast("❌ رمز اشتباهه!", true);
    document.getElementById("adminPass").value = "";
  }
}

async function api(path, options) {
  options = options || {};
  var res = await fetch(API + path, {
    method: options.method || "GET",
    headers: Object.assign({"Content-Type": "application/json"}, options.headers || {}),
    body: options.body
  });
  return res;
}

async function load() {
  try {
    var resS = await api("/rest/v1/songs?select=*");
    if (resS.ok) {
      var s = await resS.json();
      songs = (s || []).map(function(x) { return Object.assign({}, x, {file: (x.file || "").trim()}); });
    }
    
    var resL = await api("/rest/v1/likes?select=*");
    if (resL.ok) {
      online = true;
      var badge = document.getElementById("badge");
      if (!isAdmin) {
        badge.textContent = "🌐 حالت مشترک (لایک/کامنت برای همه)";
        badge.style.background = "rgba(6,214,160,0.5)";
      } else {
        badge.textContent = "👑 حالت ادمین";
        badge.style.background = "rgba(245,158,11,0.5)";
      }
      
      var L = await resL.json();
      data.likes = {};
      if (L) L.forEach(function(x) { data.likes[x.song_id] = x.count; });
      
      var resC = await api("/rest/v1/comments?select=*&order=created_at");
      var C = await resC.json();
      data.comments = {};
      if (C) C.forEach(function(x) {
        if (!data.comments[x.song_id]) data.comments[x.song_id] = [];
        data.comments[x.song_id].push({
          id: x.id, name: x.name, text: x.text,
          time: new Date(x.created_at).getTime()
        });
      });
    }
  } catch(e) { console.log(e); }
  
  if (!online) {
    document.getElementById("badge").textContent = "📱 حالت محلی";
    document.getElementById("badge").style.background = "rgba(245,158,11,0.5)";
    var saved = localStorage.getItem("musicData");
    if (saved) {
      var d = JSON.parse(saved);
      data.likes = d.likes || {};
      data.comments = d.comments || {};
    }
  }
  
  render();
  renderCats();
  updateStatsUI();
}

async function like(id) {
  if (localStorage.getItem("liked_" + id) === "1") {
    toast("❌ قبلاً لایک زدی!", true);
    return;
  }
  var n = (data.likes[id] || 0) + 1;
  data.likes[id] = n;
  localStorage.setItem("liked_" + id, "1");
  render();
  toast("❤️ لایک شد!");
  
  if (online) {
    try {
      await api("/rest/v1/likes", {
        method: "POST",
        headers: { "Prefer": "resolution=merge-duplicates" },
        body: JSON.stringify({ song_id: id, count: n })
      });
    } catch(e) { console.log(e); }
  } else {
    localStorage.setItem("musicData", JSON.stringify(data));
  }
}

function toggle(id) {
  document.getElementById("c-" + id).classList.toggle("show");
}

async function addC(id) {
  var n = document.getElementById("n-" + id).value.trim();
  var t = document.getElementById("t-" + id).value.trim();
  if (!n || !t) { toast("❌ پر کن!", true); return; }
  
  for (var i = 0; i < BAD_WORDS.length; i++) {
    if (t.indexOf(BAD_WORDS[i]) !== -1 || n.indexOf(BAD_WORDS[i]) !== -1) {
      toast("❌ کلمه غیراخلاقی!", true);
      return;
    }
  }
  
  document.getElementById("n-" + id).value = "";
  document.getElementById("t-" + id).value = "";
  toast("✅ ثبت شد!");
  
  if (online) {
    try {
      await api("/rest/v1/comments", {
        method: "POST",
        body: JSON.stringify({ song_id: id, name: n, text: t })
      });
      await load();
      document.getElementById("c-" + id).classList.add("show");
    } catch(e) { console.log(e); }
  } else {
    if (!data.comments[id]) data.comments[id] = [];
    data.comments[id].push({ id: Date.now(), name: n, text: t, time: Date.now() });
    localStorage.setItem("musicData", JSON.stringify(data));
    render();
    document.getElementById("c-" + id).classList.add("show");
  }
}

async function deleteComment(songId, commentId) {
  if (!isAdmin) { toast("❌ فقط ادمین!", true); return; }
  if (!confirm("حذف کنم؟")) return;
  
  if (data.comments[songId]) {
    data.comments[songId] = data.comments[songId].filter(function(c) {
      return String(c.id) !== String(commentId);
    });
  }
  render();
  toast("🗑️ حذف شد!");
  
  if (online) {
    try {
      await api("/rest/v1/comments?id=eq." + commentId, { method: "DELETE" });
    } catch(e) { console.log(e); }
  } else {
    localStorage.setItem("musicData", JSON.stringify(data));
  }
}

function share(name, file) {
  var url = window.location.origin + window.location.pathname + file;
  var text = "🎵 " + name + "\n" + url;
  if (navigator.share) navigator.share({ title: name, text: text, url: url });
  else navigator.clipboard.writeText(text).then(function() { toast("✅ کپی شد!"); });
}

function sortBy(type) {
  sortType = type;
  render();
  toast("🔄 مرتب شد!");
}

function renderCats() {
  var cats = ["all"];
  songs.forEach(function(s) {
    if (s.cat && cats.indexOf(s.cat) === -1) cats.push(s.cat);
  });
  document.getElementById("cats").innerHTML = cats.map(function(c) {
    return '<button class="' + (c==='all'?'active':'') + '" data-c="' + c + '">' + (c==='all'?'همه':c) + '</button>';
  }).join("");
  document.getElementById("cats").onclick = function(e) {
    if (e.target.tagName === 'BUTTON') {
      document.querySelectorAll(".cats button").forEach(function(b) { b.classList.remove("active"); });
      e.target.classList.add("active");
      cat = e.target.dataset.c;
      render();
    }
  };
}

document.getElementById("s").oninput = render;

function render() {
  var q = document.getElementById("s").value.toLowerCase();
  var list = songs.slice();
  if (cat !== "all") list = list.filter(function(s) { return s.cat === cat; });
  if (q) list = list.filter(function(s) { return s.name.toLowerCase().indexOf(q) !== -1; });
  
  if (sortType === "like") list.sort(function(a,b) { return (data.likes[b.id]||0) - (data.likes[a.id]||0); });
  else if (sortType === "name") list.sort(function(a,b) { return a.name.localeCompare(b.name, 'fa'); });
  else if (sortType === "new") list.sort(function(a,b) { return b.id > a.id ? 1 : -1; });

  document.getElementById("songs").innerHTML = list.map(function(s) {
    var l = data.likes[s.id] || 0;
    var cs = (data.comments[s.id] || []).slice().sort(function(a,b) { return (b.time||0) - (a.time||0); });
    var liked = localStorage.getItem("liked_" + s.id) === "1";
    return '<div class="song">' +
      '<div class="cover">🎵</div>' +
      '<div class="info">' +
        '<h3>' + s.name + '</h3>' +
        '<audio controls src="' + s.file + '"></audio>' +
        '<div class="actions">' +
          '<button class="like ' + (liked?'liked':'') + '" data-song-id="' + s.id + '" onclick="like(\'' + s.id + '\')">' + (liked?'💔':'❤️') + ' ' + l + '</button>' +
          '<a href="' + s.file + '" download class="dl">⬇️ دانلود</a>' +
          '<button class="cmt" onclick="toggle(\'' + s.id + '\')">💬 کامنت (' + cs.length + ')</button>' +
          '<button class="share" onclick="share(\'' + s.name.replace(/'/g,"\\'") + '\', \'' + s.file + '\')">📤 اشتراک</button>' +
        '</div>' +
        '<div class="comments" id="c-' + s.id + '">' +
          (cs.length === 0 ? '<p style="color:#999;font-size:0.85rem">هنوز کامنتی نیست</p>' :
            cs.map(function(c) {
              return '<div class="comment" data-id="' + c.id + '">' +
                '<div><b>' + c.name + '</b> <span class="time">' + (c.time ? new Date(c.time).toLocaleString("fa-IR") : "") + '</span><div>' + c.text + '</div></div>' +
                '<button class="delete-btn ' + (isAdmin?'show':'') + '" onclick="deleteComment(\'' + s.id + '\', \'' + c.id + '\')">🗑️</button>' +
              '</div>';
            }).join("")) +
          '<div class="cform">' +
            '<input id="n-' + s.id + '" placeholder="اسم" maxlength="50">' +
            '<input id="t-' + s.id + '" placeholder="کامنت" maxlength="500">' +
            '<button onclick="addC(\'' + s.id + '\')">ارسال</button>' +
          '</div>' +
          '<div class="warn">⚠️ کامنت‌های غیراخلاقی حذف می‌شوند</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join("");

  updateStatsUI();
}

function updateStatsUI() {
  var tl = 0, tc = 0;
  Object.values(data.likes).forEach(function(v) { tl += v; });
  Object.values(data.comments).forEach(function(a) { tc += (a || []).length; });
  document.getElementById("lc").textContent = tl;
  document.getElementById("cc").textContent = tc;
  document.getElementById("sc").textContent = songs.length;
}

async function silentRefresh() {
  if (!online) return;
  try {
    var resL = await api("/rest/v1/likes?select=*");
    if (resL.ok) {
      var L = await resL.json();
      var newLikes = {};
      if (L) L.forEach(function(x) { newLikes[x.song_id] = x.count; });
      if (JSON.stringify(newLikes) !== JSON.stringify(data.likes)) {
        data.likes = newLikes;
        render();
      }
    }
    var resC = await api("/rest/v1/comments?select=*&order=created_at");
    if (resC.ok) {
      var C = await resC.json();
      var newComments = {};
      if (C) C.forEach(function(x) {
        if (!newComments[x.song_id]) newComments[x.song_id] = [];
        newComments[x.song_id].push({
          id: x.id, name: x.name, text: x.text,
          time: new Date(x.created_at).getTime()
        });
      });
      if (JSON.stringify(newComments) !== JSON.stringify(data.comments)) {
        data.comments = newComments;
        render();
      }
    }
  } catch(e) { console.log(e); }
}

function toggleTheme() {
  document.body.classList.toggle("dark");
  var isDark = document.body.classList.contains("dark");
  document.getElementById("themeBtn").textContent = isDark ? "☀️ حالت روز" : "🌙 حالت شب";
  localStorage.setItem("theme", isDark ? "dark" : "light");
}

if (localStorage.getItem("theme") === "dark") {
  document.body.classList.add("dark");
  document.getElementById("themeBtn").textContent = "☀️ حالت روز";
}

if (isAdmin) {
  document.getElementById("adminBtn").textContent = "🔓 خروج از ادمین";
  document.getElementById("adminBtn").classList.add("admin-active");
}

load();
setInterval(silentRefresh, 5000);
</script>
</body>
</html>
