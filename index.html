<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎵 آهنگ‌های من</title>
<style>
body { font-family: Tahoma; background: linear-gradient(135deg, #667eea, #764ba2); min-height: 100vh; padding: 20px; margin: 0; }
h1 { text-align: center; color: white; }
.stats { text-align: center; color: white; margin-bottom: 20px; font-size: 1.1rem; }
.song { background: white; border-radius: 15px; padding: 20px; margin: 20px auto; max-width: 700px; }
.actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
button, .btn { padding: 9px 18px; border-radius: 8px; border: none; cursor: pointer; color: white; font-family: Tahoma; text-decoration: none; font-weight: bold; }
.like { background: #ef4444; }
.download { background: #06d6a0; }
.comment { background: #f59e0b; }
.comment-box { display: none; margin-top: 15px; padding-top: 15px; border-top: 1px solid #eee; }
.comment-box.show { display: block; }
.comment { background: #f5f5f5; padding: 8px; border-radius: 8px; margin-bottom: 6px; }
input { padding: 8px; border: 1px solid #ddd; border-radius: 8px; font-family: Tahoma; }
</style>
</head>
<body>
<h1>🎵 آهنگ‌های من</h1>
<div class="stats">❤️ <span id="likeCount">0</span> لایک | 💬 <span id="commentCount">0</span> کامنت</div>
<div id="songs"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, onValue, set, push } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

const firebaseConfig = {
  databaseURL: "https://music-site-a2343-default-rtdb.firebaseio.com/"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
console.log("🔥 Firebase وصل شد");

const songs = [
  { id: 1, name: "علی منتظری - جانان", file: "janan.mp3" },
  { id: 2, name: "علی ایزدی - محلی شیرازی", file: "mahali.mp3" }
];

let data = { likes: {}, comments: {} };

onValue(ref(db, "likes"), snap => {
  data.likes = snap.val() || {};
  console.log("❤️ لایک‌ها:", data.likes);
  render();
});

onValue(ref(db, "comments"), snap => {
  data.comments = snap.val() || {};
  console.log("💬 کامنت‌ها:", data.comments);
  render();
});

function render() {
  const c = document.getElementById("songs");
  let sorted = [...songs].sort((a,b) => (data.likes[b.id]||0) - (data.likes[a.id]||0));
  c.innerHTML = sorted.map(s => {
    const likes = data.likes[s.id] || 0;
    const liked = localStorage.getItem("liked_" + s.id) === "1";
    return `
    <div class="song">
      <h3>${s.name}</h3>
      <audio controls src="${s.file}" style="width:100%"></audio>
      <div class="actions">
        <button class="like" onclick="window.toggleLike(${s.id})">${liked?'💔':'❤️'} ${likes}</button>
        <a href="${s.file}" download class="btn download">⬇️ دانلود</a>
        <button class="comment" onclick="window.toggleComments(${s.id})">💬 کامنت</button>
      </div>
      <div class="comment-box" id="c-${s.id}">
        <div id="cl-${s.id}"></div>
        <div style="display:flex;gap:5px;margin-top:10px">
          <input id="n-${s.id}" placeholder="اسم">
          <input id="t-${s.id}" placeholder="کامنت">
          <button class="comment" onclick="window.addComment(${s.id})">ارسال</button>
        </div>
      </div>
    </div>`;
  }).join("");
  songs.forEach(s => loadComments(s.id));
  updateStats();
}

window.toggleLike = function(id) {
  const liked = localStorage.getItem("liked_" + id) === "1";
  const current = data.likes[id] || 0;
  set(ref(db, "likes/" + id), liked ? Math.max(0, current - 1) : current + 1);
  localStorage.setItem("liked_" + id, liked ? "0" : "1");
};

window.toggleComments = function(id) {
  document.getElementById("c-" + id).classList.toggle("show");
};

window.addComment = function(id) {
  const name = document.getElementById("n-" + id).value.trim();
  const text = document.getElementById("t-" + id).value.trim();
  if (!name || !text) return alert("پر کن!");
  push(ref(db, "comments/" + id), { name, text, time: Date.now() })
    .then(() => {
      console.log("✅ کامنت ذخیره شد");
      document.getElementById("n-" + id).value = "";
      document.getElementById("t-" + id).value = "";
    })
    .catch(e => alert("خطا: " + e.message));
};

function loadComments(id) {
  const el = document.getElementById("cl-" + id);
  const obj = data.comments[id] || {};
  const list = Object.values(obj).sort((a,b) => a.time - b.time);
  el.innerHTML = list.length === 0
    ? '<p style="color:#999;font-size:0.85rem">هنوز کامنتی نیست</p>'
    : list.map(c => `<div class="comment"><b>${c.name}</b>: ${c.text}</div>`).join("");
}

function updateStats() {
  let l = 0, c = 0;
  Object.values(data.likes).forEach(v => l += v);
  Object.values(data.comments).forEach(o => c += Object.keys(o).length);
  document.getElementById("likeCount").textContent = l;
  document.getElementById("commentCount").textContent = c;
}
</script>
</body>
</html>
