<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="X-Frame-Options" content="DENY">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<title>🎵 آهنگ‌های من</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');

*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
input,textarea{-webkit-user-select:text;user-select:text}

:root{
  --primary:#667eea;
  --secondary:#764ba2;
  --accent:#06d6a0;
  --danger:#ef4444;
  --warn:#f59e0b;
  --share:#8b5cf6;
}

body{
  font-family:'Vazirmatn',Tahoma,sans-serif;
  background:linear-gradient(135deg,#667eea 0%,#764ba2 50%,#f093fb 100%);
  background-size:400% 400%;
  animation:gradientBG 15s ease infinite;
  min-height:100vh;
  padding:20px;
  color:#fff;
  transition:0.3s;
  overflow-x:hidden;
}

@keyframes gradientBG{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

body.dark{
  background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);
  background-size:400% 400%;
  animation:gradientBG 15s ease infinite;
}

h1{
  text-align:center;
  font-size:2.5rem;
  font-weight:900;
  margin-bottom:10px;
  text-shadow:0 5px 20px rgba(0,0,0,0.3);
  animation:titleFloat 3s ease-in-out infinite;
}

@keyframes titleFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
}

.stats{display:flex;justify-content:center;gap:15px;margin-bottom:25px;flex-wrap:wrap}
.stat-box{
  background:rgba(255,255,255,0.2);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  padding:12px 22px;
  border-radius:50px;
  font-size:0.9rem;
  border:1px solid rgba(255,255,255,0.3);
  transition:0.3s;
  cursor:default;
}
.stat-box:hover{transform:translateY(-3px);background:rgba(255,255,255,0.3)}

.badge{
  text-align:center;
  margin-bottom:15px;
  padding:8px 15px;
  border-radius:50px;
  display:inline-block;
  font-size:0.85rem;
  transition:0.3s;
}

.top-bar{display:flex;justify-content:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.top-bar button{
  background:rgba(255,255,255,0.2);
  backdrop-filter:blur(10px);
  color:#fff;
  border:2px solid rgba(255,255,255,0.4);
  padding:10px 18px;
  border-radius:50px;
  cursor:pointer;
  font-family:'Vazirmatn',Tahoma;
  font-size:0.85rem;
  font-weight:700;
  transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
  position:relative;
  overflow:hidden;
}
.top-bar button::before{
  content:'';
  position:absolute;
  top:50%;left:50%;
  width:0;height:0;
  background:rgba(255,255,255,0.3);
  border-radius:50%;
  transform:translate(-50%,-50%);
  transition:width 0.6s,height 0.6s;
}
.top-bar button:hover::before{width:300px;height:300px}
.top-bar button:hover{transform:translateY(-3px);box-shadow:0 10px 25px rgba(0,0,0,0.3)}

.search{max-width:500px;margin:0 auto 20px;position:relative}
.search input{
  width:100%;
  padding:15px 25px;
  border:none;
  border-radius:50px;
  font-family:'Vazirmatn',Tahoma;
  font-size:1rem;
  outline:none;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);
  transition:0.3s;
}
.search input:focus{box-shadow:0 15px 40px rgba(0,0,0,0.3);transform:scale(1.02)}

.cats{display:flex;justify-content:center;gap:10px;margin-bottom:30px;flex-wrap:wrap}
.cats button{
  background:rgba(255,255,255,0.2);
  backdrop-filter:blur(10px);
  color:#fff;
  border:2px solid rgba(255,255,255,0.4);
  padding:8px 20px;
  border-radius:50px;
  cursor:pointer;
  font-family:'Vazirmatn',Tahoma;
  font-weight:700;
  transition:0.3s;
}
.cats button.active,.cats button:hover{
  background:#fff;
  color:var(--primary);
  transform:translateY(-3px);
  box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

.songs{max-width:850px;margin:0 auto;display:grid;gap:20px}
.song{
  background:rgba(255,255,255,0.98);
  color:#333;
  border-radius:20px;
  padding:20px;
  box-shadow:0 15px 40px rgba(0,0,0,0.25);
  display:flex;
  gap:20px;
  align-items:center;
  transition:all 0.4s cubic-bezier(0.4,0,0.2,1);
  animation:slideUp 0.6s ease-out;
  position:relative;
  overflow:hidden;
}

@keyframes slideUp{
  from{opacity:0;transform:translateY(30px)}
  to{opacity:1;transform:translateY(0)}
}

.song::before{
  content:'';
  position:absolute;
  top:0;left:-100%;
  width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(102,126,234,0.1),transparent);
  transition:left 0.6s;
}
.song:hover::before{left:100%}

.song:hover{transform:translateY(-5px) scale(1.01);box-shadow:0 25px 60px rgba(0,0,0,0.35)}

body.dark .song{background:#2a2a3e;color:#fff}

.cover{
  width:90px;height:90px;
  border-radius:15px;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  display:flex;align-items:center;justify-content:center;
  font-size:2.5rem;flex-shrink:0;
  transition:0.3s;
  box-shadow:0 10px 25px rgba(102,126,234,0.4);
  animation:pulse 2s ease-in-out infinite;
}

@keyframes pulse{
  0%,100%{box-shadow:0 10px 25px rgba(102,126,234,0.4)}
  50%{box-shadow:0 15px 40px rgba(102,126,234,0.7)}
}

.song:hover .cover{transform:rotate(10deg) scale(1.1)}

.info{flex:1}
.info h3{margin-bottom:10px;font-weight:700}
audio{width:100%;margin-bottom:8px;border-radius:50px}

.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.actions button,.actions a{
  padding:10px 18px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-family:'Vazirmatn',Tahoma;
  font-weight:700;
  color:#fff;
  text-decoration:none;
  font-size:0.9rem;
  transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
  box-shadow:0 5px 15px rgba(0,0,0,0.2);
}
.actions button:hover,.actions a:hover{transform:translateY(-3px) scale(1.05);box-shadow:0 10px 25px rgba(0,0,0,0.3)}
.actions button:active,.actions a:active{transform:scale(0.95)}

.like{background:linear-gradient(135deg,#ef4444,#dc2626)}
.like.liked{background:linear-gradient(135deg,#6b7280,#4b5563)}
.dl{background:linear-gradient(135deg,#06d6a0,#059669)}
.cmt{background:linear-gradient(135deg,#f59e0b,#d97706)}
.share{background:linear-gradient(135deg,#8b5cf6,#7c3aed)}

.comments{
  display:none;
  margin-top:15px;
  padding-top:15px;
  border-top:1px solid #eee;
  animation:slideDown 0.3s ease-out;
}
@keyframes slideDown{
  from{opacity:0;max-height:0}
  to{opacity:1;max-height:2000px}
}
body.dark .comments{border-color:#444}
.comments.show{display:block}

.comment{
  background:rgba(245,245,245,0.9);
  padding:12px;
  border-radius:10px;
  margin-bottom:8px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
  animation:slideUp 0.3s;
  transition:0.3s;
}
.comment:hover{transform:translateX(-5px);box-shadow:0 5px 15px rgba(0,0,0,0.1)}
body.dark .comment{background:#1a1a2e}
.comment .content{flex:1}
.comment b{color:var(--primary);font-weight:900}
.comment .time{font-size:0.75rem;color:#999;margin-right:10px}
.comment .delete-btn{
  background:linear-gradient(135deg,#ef4444,#dc2626);
  color:#fff;border:none;border-radius:8px;
  padding:6px 10px;cursor:pointer;font-size:0.8rem;
  transition:0.3s;
}
.comment .delete-btn:hover{transform:scale(1.1)}

.cform{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap}
.cform input{
  flex:1;min-width:100px;padding:10px;
  border:2px solid #ddd;border-radius:10px;
  font-family:'Vazirmatn',Tahoma;
  transition:0.3s;
}
.cform input:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px rgba(102,126,234,0.2)}
body.dark .cform input{background:#1a1a2e;color:#fff;border-color:#444}
.cform button{
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  color:#fff;border:none;padding:10px 20px;border-radius:10px;
  cursor:pointer;font-family:'Vazirmatn',Tahoma;font-weight:700;
  transition:0.3s;
}
.cform button:hover{transform:scale(1.05);box-shadow:0 10px 25px rgba(102,126,234,0.5)}

.warn{color:var(--warn);font-size:0.8rem;margin-top:5px;font-weight:700}

/* Toast */
.toast{
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  background:linear-gradient(135deg,var(--accent),#059669);
  color:#fff;
  padding:15px 25px;
  border-radius:15px;
  font-weight:700;
  box-shadow:0 15px 40px rgba(0,0,0,0.3);
  z-index:9999;
  display:none;
  animation:toastIn 0.3s;
}
.toast.error{background:linear-gradient(135deg,var(--danger),#dc2626)}
.toast.show{display:block}
@keyframes toastIn{
  from{opacity:0;transform:translate(-50%,-30px)}
  to{opacity:1;transform:translate(-50%,0)}
}

@media(max-width:600px){
  h1{font-size:1.8rem}
  .song{flex-direction:column;text-align:center}
  .actions{justify-content:center}
}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<h1>🎵 آهنگ‌های من</h1>
<div style="text-align:center"><span class="badge" id="badge">⏳ در حال بررسی...</span></div>

<div class="top-bar">
  <button onclick="toggleTheme()" id="themeBtn">🌙 حالت شب</button>
  <button onclick="sortBy('like')">🔥 پرطرفدار</button>
  <button onclick="sortBy('new')">🆕 جدیدترین</button>
  <button onclick="sortBy('name')">🔤 الفبایی</button>
</div>

<div class="stats">
  <div class="stat-box">🎵 <span id="sc">0</span> آهنگ</div>
  <div class="stat-box">❤️ <span id="lc">0</span> لایک</div>
  <div class="stat-box">💬 <span id="cc">0</span> کامنت</div>
</div>
<div class="search"><input id="s" placeholder="🔍 جستجو..."></div>
<div class="cats" id="cats"></div>
<div class="songs" id="songs"></div>

<script>
// ==========================================
// 🔒 ضد هک و ضد کپی
// ==========================================
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => {
  // F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U
  if (e.key === 'F12' ||
      (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j')) ||
      (e.ctrlKey && (e.key === 'U' || e.key === 'u'))) {
    e.preventDefault();
    return false;
  }
});
document.addEventListener('dragstart', e => e.preventDefault());
document.addEventListener('selectstart', e => e.preventDefault());

// ==========================================
// 🎯 داده‌ها
// ==========================================
const API = "https://music-api.mhg090909.workers.dev";
const BAD_WORDS = ["فحش","احمق","خری","کثافت","بی‌شعور","بیشعور","دیوث","کس","کیر","جنده","لاشی","پدرسگ","مادر","خواهر","لعنت","مرگ","نفرین","حروم","حرومزاده","خار","کونی","گایید","بگا","سگ","پفیوز","کص","کون","جقی","عن","شاش","گوه"];

let songs = [];
let data = { likes: {}, comments: {} };
let cat = "all";
let online = false;
let sortType = "like";

// ==========================================
// 📢 Toast
// ==========================================
function toast(msg, isError = false) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show" + (isError ? " error" : "");
  setTimeout(() => t.classList.remove("show"), 3000);
}

// ==========================================
// 🌐 API
// ==========================================
async function api(path, options = {}) {
  const res = await fetch(API + path, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      ...(options.headers || {})
    }
  });
  return res;
}

// ==========================================
// 📥 بارگذاری
// ==========================================
async function load() {
  try {
    const resS = await api("/rest/v1/songs?select=*");
    if (resS.ok) {
      songs = await resS.json() || [];
      songs = songs.map(s => ({...s, file: (s.file || "").trim()}));
    }
    
    const resL = await api("/rest/v1/likes?select=*");
    if (resL.ok) {
      online = true;
      document.getElementById("badge").textContent = "🌐 حالت مشترک (لایک/کامنت برای همه)";
      document.getElementById("badge").style.background = "rgba(6,214,160,0.5)";
      
      const L = await resL.json();
      data.likes = {};
      if (L) L.forEach(x => data.likes[x.song_id] = x.count);
      
      const resC = await api("/rest/v1/comments?select=*&order=created_at");
      const C = await resC.json();
      data.comments = {};
      if (C) C.forEach(x => {
        if (!data.comments[x.song_id]) data.comments[x.song_id] = [];
        data.comments[x.song_id].push({...x, time: new Date(x.created_at).getTime()});
      });
    }
  } catch(e) { console.log(e); }
  
  if (!online) {
    document.getElementById("badge").textContent = "📱 حالت محلی (فقط خودت)";
    document.getElementById("badge").style.background = "rgba(245,158,11,0.5)";
    const saved = localStorage.getItem("musicData");
    if (saved) {
      const d = JSON.parse(saved);
      data.likes = d.likes || {};
      data.comments = d.comments || {};
    }
  }
  
  render();
  renderCats();
}

// ==========================================
// ❤️ لایک
// ==========================================
window.like = async function(id) {
  if (localStorage.getItem("liked_" + id) === "1") {
    toast("❌ قبلاً لایک زدی!", true);
    return;
  }
  
  const n = (data.likes[id] || 0) + 1;
  data.likes[id] = n;
  localStorage.setItem("liked_" + id, "1");
  render();
  toast("❤️ لایک شد!");
  
  if (online) {
    try {
      await api("/rest/v1/likes", {
        method: "POST",
        headers: { "Prefer": "resolution=merge-duplicates" },
        body: JSON.stringify({ song_id: id, count: n })
      });
    } catch(e) { console.log(e); }
  } else {
    localStorage.setItem("musicData", JSON.stringify(data));
  }
};

// ==========================================
// 💬 کامنت
// ==========================================
window.toggle = id => document.getElementById("c-" + id).classList.toggle("show");

window.addC = async function(id) {
  const n = document.getElementById("n-" + id).value.trim();
  const t = document.getElementById("t-" + id).value.trim();
  if (!n || !t) return toast("❌ اسم و کامنت رو پر کن!", true);
  
  for (const word of BAD_WORDS) {
    if (t.includes(word) || n.includes(word)) {
      return toast("❌ کامنت حاوی کلمات غیراخلاقی است!", true);
    }
  }
  
  if (t.length > 500) return toast("❌ کامنت طولانیه! (حداکثر ۵۰۰)", true);
  if (n.length > 50) return toast("❌ اسم طولانیه! (حداکثر ۵۰)", true);
  
  const newComment = { name: n, text: t, time: Date.now() };
  if (!data.comments[id]) data.comments[id] = [];
  data.comments[id].push(newComment);
  render();
  document.getElementById("n-" + id).value = "";
  document.getElementById("t-" + id).value = "";
  document.getElementById("c-" + id).classList.add("show");
  toast("✅ کامنت ثبت شد!");
  
  if (online) {
    try {
      await api("/rest/v1/comments", {
        method: "POST",
        body: JSON.stringify({ song_id: id, name: n, text: t })
      });
    } catch(e) { console.log(e); }
  } else {
    localStorage.setItem("musicData", JSON.stringify(data));
  }
};

// ==========================================
// 🗑️ حذف کامنت
// ==========================================
window.deleteComment = async function(songId, commentTime) {
  if (!confirm("مطمئنی می‌خوای این کامنت رو حذف کنی؟")) return;
  
  data.comments[songId] = data.comments[songId].filter(c => c.time !== commentTime);
  render();
  toast("🗑️ حذف شد!");
  
  if (online) {
    try {
      await api(`/rest/v1/comments?song_id=eq.${songId}&created_at=eq.${new Date(commentTime).toISOString()}`, {
        method: "DELETE"
      });
    } catch(e) { console.log(e); }
  } else {
    localStorage.setItem("musicData", JSON.stringify(data));
  }
};

// ==========================================
// 📤 اشتراک
// ==========================================
window.share = function(name, file) {
  const url = window.location.origin + window.location.pathname + file;
  const text = `🎵 ${name}\n${url}`;
  if (navigator.share) {
    navigator.share({ title: name, text: text, url: url });
  } else {
    navigator.clipboard.writeText(text).then(() => toast("✅ لینک کپی شد!"));
  }
};

// ==========================================
// 🔄 مرتب‌سازی
// ==========================================
window.sortBy = function(type) {
  sortType = type;
  render();
  toast("🔄 مرتب شد!");
};

// ==========================================
// دسته‌بندی
// ==========================================
function renderCats() {
  const cats = ["all", ...new Set(songs.map(s => s.cat).filter(c => c))];
  document.getElementById("cats").innerHTML = cats.map(c =>
    `<button class="${c==='all'?'active':''}" data-c="${c}">${c==='all'?'همه':c}</button>`
  ).join("");
  document.getElementById("cats").onclick = e => {
    if (e.target.tagName === 'BUTTON') {
      document.querySelectorAll(".cats button").forEach(b => b.classList.remove("active"));
      e.target.classList.add("active");
      cat = e.target.dataset.c;
      render();
    }
  };
}

document.getElementById("s").oninput = render;

// ==========================================
// 🎨 نمایش
// ==========================================
function render() {
  const q = document.getElementById("s").value.toLowerCase();
  let list = [...songs];
  if (cat !== "all") list = list.filter(s => s.cat === cat);
  if (q) list = list.filter(s => s.name.toLowerCase().includes(q));
  
  if (sortType === "like") {
    list.sort((a,b) => (data.likes[b.id]||0) - (data.likes[a.id]||0));
  } else if (sortType === "name") {
    list.sort((a,b) => a.name.localeCompare(b.name, 'fa'));
  } else if (sortType === "new") {
    list.sort((a,b) => (b.id > a.id ? 1 : -1));
  }

  document.getElementById("songs").innerHTML = list.map(s => {
    const l = data.likes[s.id] || 0;
    const cs = (data.comments[s.id] || []).slice().sort((a,b) => (b.time||0) - (a.time||0));
    const liked = localStorage.getItem("liked_" + s.id) === "1";
    return `<div class="song">
      <div class="cover">🎵</div>
      <div class="info">
        <h3>${s.name}</h3>
        <audio controls src="${s.file}"></audio>
        <div class="actions">
          <button class="like ${liked?'liked':''}" onclick="window.like('${s.id}')">${liked?'💔':'❤️'} ${l}</button>
          <a href="${s.file}" download class="dl">⬇️ دانلود</a>
          <button class="cmt" onclick="window.toggle('${s.id}')">💬 کامنت (${cs.length})</button>
          <button class="share" onclick="window.share('${s.name}', '${s.file}')">📤 اشتراک</button>
        </div>
        <div class="comments" id="c-${s.id}">
          ${cs.length === 0 ? '<p style="color:#999;font-size:0.85rem">هنوز کامنتی نیست</p>' :
            cs.map(c => `<div class="comment">
              <div class="content">
                <b>${c.name}</b>
                <span class="time">${c.time ? new Date(c.time).toLocaleString("fa-IR") : ""}</span>
                <div>${c.text}</div>
              </div>
              <button class="delete-btn" onclick="window.deleteComment('${s.id}', ${c.time})">🗑️</button>
            </div>`).join("")}
          <div class="cform">
            <input id="n-${s.id}" placeholder="اسم" maxlength="50">
            <input id="t-${s.id}" placeholder="کامنت" maxlength="500">
            <button onclick="window.addC('${s.id}')">ارسال</button>
          </div>
          <div class="warn">⚠️ کامنت‌های غیراخلاقی حذف می‌شوند</div>
        </div>
      </div>
    </div>`;
  }).join("");

  let tl = 0, tc = 0;
  Object.values(data.likes).forEach(v => tl += v);
  Object.values(data.comments).forEach(a => tc += (a || []).length);
  document.getElementById("lc").textContent = tl;
  document.getElementById("cc").textContent = tc;
  document.getElementById("sc").textContent = songs.length;
}

// ==========================================
// 🌙 حالت شب
// ==========================================
window.toggleTheme = function() {
  document.body.classList.toggle("dark");
  const isDark = document.body.classList.contains("dark");
  document.getElementById("themeBtn").textContent = isDark ? "☀️ حالت روز" : "🌙 حالت شب";
  localStorage.setItem("theme", isDark ? "dark" : "light");
};
if (localStorage.getItem("theme") === "dark") {
  document.body.classList.add("dark");
  document.getElementById("themeBtn").textContent = "☀️ حالت روز";
}

// ==========================================
// 🚀 شروع + رفرش خودکار هر ۳۰ ثانیه
// ==========================================
load();
setInterval(load, 30000);
</script>
